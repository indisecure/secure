<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student</title>
  <link
    th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css}"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous">
</head>
<body class="container-fluid">
  <h1 class="text-danger text-center my-4">Students</h1>

  <div class="table-responsive">
    <table class="table table-bordered border-danger">
      <thead class="table-light">
        <tr>
          <th>Student Id</th>
          <th>Student Name</th>
          <th>Student Email</th>
          <th>Student Address</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="student : ${data}">
          <td th:text="${student.id}"></td> 
          <td th:text="${student.name}"></td>
          <td th:text="${student.email}"></td>
          <td th:text="${student.address}"></td>
          <td>
            <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-sm btn-outline-primary me-2">Edit</a>
            <a th:href="@{/students/{id}/delete(id=${student.id})}" class="btn btn-sm btn-outline-danger">Delete</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="d-flex flex-column flex-md-row justify-content-center gap-3 my-4">
    <a href="/students/new" class="btn btn-success">Add New Student</a>
    <a href="/" class="btn btn-secondary">Home Page</a>
  </div>

  <script
    th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js}"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>
</html>
