<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Students Dashboard</title>
  <link
    th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css}"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous">
  <style>
    body {
      background-color: #f4f6f9;
    }
    .dashboard-card {
      border: none;
      border-radius: 14px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.06);
      overflow: hidden;
    }
    .table thead th {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #495057;
      background-color: #f8f9fa;
      border-bottom-width: 2px;
      white-space: nowrap;
    }
    .table tbody tr {
      transition: background-color 0.15s ease;
    }
    .table tbody tr:hover {
      background-color: #fff5f5;
    }
    .avatar-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background-color: #ffe3e3;
      color: #c92a2a;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container py-4 py-md-5">
    <!-- Top Header & Primary Actions -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
      <div>
        <div class="d-flex align-items-center gap-2">
          <h1 class="h3 fw-bold text-dark mb-0">Students</h1>
          <span class="badge rounded-pill text-bg-danger" th:text="${#lists.size(data)} + ' Total'">0 Total</span>
        </div>
        <p class="text-muted small mb-0 mt-1">Manage student records, contact details, and enrollments.</p>
      </div>

      <div class="d-flex flex-wrap align-items-center gap-2">        
        <a th:href="@{/students/new}" class="btn btn-danger fw-medium px-3">+ Add New Student</a>

     
        <form th:action="@{/logout}" method="get" class="d-inline m-0">
          <button type="submit" class="btn btn-outline-dark">Logout</button>
        </form>
      </div>
    </div>

    <!-- Table Card -->
    <div class="card dashboard-card bg-white">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th class="ps-4">ID</th>
                <th>Student Name</th>
                <th>Email</th>
                <th>Address</th>
                <th class="text-end pe-4">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="student : ${data}">
                <td class="ps-4 fw-semibold text-secondary" th:text="'#' + ${student.id}"></td>
                <td>
                  <div class="d-flex align-items-center gap-2">
                    <span class="avatar-circle"
                          th:text="${student.name != null and !#strings.isEmpty(student.name) ? #strings.toUpperCase(#strings.substring(student.name, 0, 1)) : 'S'}">S</span>
                    <span class="fw-medium text-dark" th:text="${student.name}"></span>
                  </div>
                </td>
                <td class="text-muted" th:text="${student.email}"></td>
                <td class="text-secondary" th:text="${student.address}"></td>
                <td class="text-end pe-4 text-nowrap">
                  <a th:href="@{/students/edit/{id}(id=${student.id})}"
                     class="btn btn-sm btn-outline-primary me-1">Edit</a>
                  <a th:href="@{/students/{id}/delete(id=${student.id})}"
                     class="btn btn-sm btn-outline-danger"
                     onclick="return confirm('Are you sure you want to delete this student?');">Delete</a>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(data)}">
                <td colspan="5" class="text-center py-5 text-muted">
                  No students found. Click <strong>+ Add New Student</strong> to create the first record.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script
    th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js}"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>
</html>
