<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Student Form</title>
  <link
    th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css}"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous">
</head>
<body class="container py-4">
  <h1 class="text-primary-emphasis text-center mb-4">Edit Student Form</h1>

  <form th:action="@{/students}" th:object="${student}" method="POST" class="text-primary-emphasis fw-semibold">
    <input type="hidden" th:if="${student.id}" th:field="*{id}">

    <div class="mb-3">
      <label for="model" class="form-label">Student Name</label>
      <input type="text" id="model" th:field="*{name}" required class="form-control">
    </div>

    <div class="mb-3">
      <label for="color" class="form-label">Student Email</label>
      <input type="email" id="color" th:field="*{email}" required class="form-control">
    </div>

    <div class="mb-3">
      <label for="price" class="form-label">Student Address</label>
      <input type="text" id="price" th:field="*{address}" required class="form-control">
    </div>

    <div class="d-grid gap-2">
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>

  <div class="text-center mt-4">
    <a href="/" class="btn btn-outline-primary">Home Page</a>
  </div>
</body>
</html>
